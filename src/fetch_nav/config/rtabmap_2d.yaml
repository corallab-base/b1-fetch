# RTAB-Map parameters for 2D mapping from the merged obstacle cloud
# (/obstacles: left/right/front cameras' points 10-90 cm above the floor,
# robot body removed, thinned to 5 cm cubes, <= 4 m, ~5 Hz) and leg odometry.
# (The 1-degree /scan was too sparse for ICP: ~17% correspondences.)
# Values are strings, as rtabmap expects.

Reg/Strategy: "1"                    # ICP on the scans (no images)
Reg/Force3DoF: "true"                # x, y, yaw only
Kp/MaxFeatures: "-1"                 # no visual words
Mem/NotLinkedNodesKept: "false"

# Add a node every 10 cm / ~3 deg of motion, refine each odometry step
# against the previous scan, and look for loop closures by proximity
# (the only loop closure possible without images).
RGBD/LinearUpdate: "0.10"
RGBD/AngularUpdate: "0.05"
RGBD/NeighborLinkRefining: "true"
RGBD/ProximityBySpace: "true"
RGBD/ProximityAngle: "180"           # the scan sees ~360 deg: try regardless of heading
RGBD/ProximityPathMaxNeighbors: "1"
RGBD/ProximityMaxGraphDepth: "0"
RGBD/OptimizeFromGraphEnd: "false"

Icp/Strategy: "1"                    # libpointmatcher
Icp/VoxelSize: "0.05"
Icp/MaxCorrespondenceDistance: "0.15"
Icp/PointToPlane: "true"
Icp/PointToPlaneK: "10"
Icp/PointToPlaneRadius: "0"
Icp/Iterations: "10"
Icp/Epsilon: "0.001"
Icp/MaxTranslation: "0.5"
Icp/OutlierRatio: "0.7"
Icp/CorrespondenceRatio: "0.2"

# Occupancy grid from the cloud: every point is an obstacle (the cloud is
# already the obstacle band, so no ground segmentation); rays from the robot
# to the points mark free space.
Grid/Sensor: "0"
Grid/3D: "false"
Grid/NormalsSegmentation: "false"
Grid/MaxGroundHeight: "-0.5"         # base_link is ~0.55 m up; the cloud starts at -0.45
Grid/CellSize: "0.05"
Grid/RangeMax: "2.5"                 # D430 depth gets noisy beyond ~2.5 m (smeared walls)
Grid/RayTracing: "true"
