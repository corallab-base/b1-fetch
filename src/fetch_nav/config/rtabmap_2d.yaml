# RTAB-Map parameters for 2D mapping from the merged obstacle cloud
# (/obstacles: left/right/front cameras' points 10-90 cm above the floor,
# robot body removed, thinned to 5 cm cubes, <= 4 m, ~5 Hz) and leg odometry.
# (The 1-degree /scan was too sparse for ICP: ~17% correspondences.)
# Values are strings, as rtabmap expects.

Reg/Strategy: "1"                    # ICP on the scans (no images)
Reg/Force3DoF: "true"                # x, y, yaw only
Kp/MaxFeatures: "-1"                 # no visual words
Mem/NotLinkedNodesKept: "false"

# Add a node every 20 cm / ~6 deg of motion (10 cm / 3 deg made updates take
# ~0.5 s after 680 nodes; continuous mapping keeps adding them), refine each
# odometry step against the previous cloud, and look for loop closures by
# proximity (and by appearance with camera:=true).
RGBD/LinearUpdate: "0.20"
RGBD/AngularUpdate: "0.10"
RGBD/NeighborLinkRefining: "true"
RGBD/ProximityBySpace: "true"
RGBD/ProximityAngle: "180"           # the scan sees ~360 deg: try regardless of heading
RGBD/ProximityPathMaxNeighbors: "1"
RGBD/ProximityMaxGraphDepth: "0"
RGBD/OptimizeFromGraphEnd: "false"

Icp/Strategy: "1"                    # libpointmatcher
Icp/VoxelSize: "0.05"
Icp/MaxCorrespondenceDistance: "0.15"
Icp/PointToPlane: "true"
Icp/PointToPlaneK: "10"
Icp/PointToPlaneRadius: "0"
Icp/Iterations: "10"
Icp/Epsilon: "0.001"
Icp/MaxTranslation: "0.5"
Icp/OutlierRatio: "0.7"
Icp/CorrespondenceRatio: "0.2"

# Occupancy grid from the cloud (already the 10-90 cm obstacle band): split
# by height only (no normals), points above Grid/MaxGroundHeight are
# obstacles; rays from the robot to the points mark free space.
Grid/Sensor: "0"
Grid/3D: "false"
Grid/NormalsSegmentation: "false"
# Points below this count as floor, not obstacles. base_link is 0.567 m up
# when walking (0.564-0.570, 2026-10-06 bag), so -0.42 is ~15 cm above the
# floor. The cloud itself starts at 10 cm (the safety filter's min_z, which
# stays): cables on the floor made thin streaks in the map, most likely
# false depth points along their edges, and any mapped cell blocks planning
# (no height in the 2D map). 10-15 cm points were ~3% of the cloud.
Grid/MaxGroundHeight: "-0.42"
Grid/CellSize: "0.05"
Grid/RangeMax: "2.0"                 # D430 depth error grows with range (smeared walls at 2.5 m, cable streaks)
Grid/RayTracing: "true"
# Drop points with fewer than 3 others within 10 cm before they become
# obstacle cells: lone depth-noise points make specks, also against walls
# and furniture where map_relay.py doesn't remove them (it only clears lone
# specks in open floor), thickening walls and narrowing gaps once inflated.
# A chair leg in the 5 cm cloud has ~4 neighbours (2 above, 2 below) and
# stays. Applies to new map nodes only. Not yet checked on a bag (2026-10-07).
Grid/NoiseFilteringRadius: "0.1"
Grid/NoiseFilteringMinNeighbors: "3"
