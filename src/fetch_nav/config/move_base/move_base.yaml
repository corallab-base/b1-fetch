# move_base for the B1. Output goes to /cmd_vel_nav (remapped in nav.launch):
# the safety filter's nav input, which never reverses and which manual
# teleop (/cmd_vel_raw) overrides.
# GlobalPlanner, not navfn: navfn would plan to goals near obstacles (it
# honours default_tolerance; GlobalPlanner in Melodic ignores it, so a goal
# within ~0.28 m of a mapped obstacle gets no plan), but its paths bend about
# twice as much and TEB spun needlessly in the sim (2026-10-07: 74/147 s and
# up to 1335 deg of turning vs 43 s / 246 deg).
base_global_planner: global_planner/GlobalPlanner
base_local_planner: teb_local_planner/TebLocalPlannerROS
controller_frequency: 10.0
planner_frequency: 1.0
controller_patience: 5.0
planner_patience: 5.0
# Turning around in place (no reverse) at 0.2-0.45 rad/s, often slowed to 30%
# by the safety filter near walls, takes longer than 15 s without moving
# 0.2 m: with 15 s move_base mistook that for oscillating and gave up.
oscillation_timeout: 40.0
oscillation_distance: 0.2
shutdown_costmaps: false
# Only clear the costmaps and retry. No rotate-in-place recovery: the 1.2 m
# body sweeps its rear legs through space no camera sees.
recovery_behaviors:
  - {name: conservative_reset, type: clear_costmap_recovery/ClearCostmapRecovery}
conservative_reset: {reset_distance: 2.0, layer_names: [obstacles]}

GlobalPlanner:
  allow_unknown: true          # continuous mapping: unexplored space may be crossed
  use_dijkstra: true
  use_grid_path: false
  default_tolerance: 0.2
  cost_factor: 0.55
  neutral_cost: 66
  lethal_cost: 253

TebLocalPlannerROS:
  # TEB, not DWA: with the path behind the robot (no reverse allowed) DWA only
  # dithered (+-0.05 m/s sideways, <0.1 rad/s) in simulation and never turned
  # around. TEB plans a timed trajectory a few seconds ahead, turning
  # included. Speeds stay below the bridge caps (vx 0.3, vy 0.2, wz 0.5).
  odom_topic: /odom
  global_plan_overwrite_orientation: true
  max_global_plan_lookahead_dist: 3.0
  # Collision-check the first 2 poses (~0.6 s ahead) before driving: with 4
  # (~1.2 s) the trajectory was rejected and replanned from scratch 208 times
  # in one 18 min run (jerky corrections). The safety filter still stops on
  # anything close.
  feasibility_check_no_poses: 2

  max_vel_x: 0.25
  max_vel_x_backwards: 0.02       # must be > 0; the filter blocks nav backward anyway
  penalty_epsilon: 0.01           # margin on the limits; must stay below max_vel_x_backwards
  max_vel_y: 0.15
  max_vel_theta: 0.35             # gentle turns: the rear legs sweep unseen space
  acc_lim_x: 0.5
  acc_lim_y: 0.5
  acc_lim_theta: 0.4              # 1.0 let the heading swing quickly (weaving)
  min_turning_radius: 0.0         # legged: turns in place

  footprint_model:
    type: polygon
    vertices: [[0.60, 0.28], [0.60, -0.28], [-0.60, -0.28], [-0.60, 0.28]]

  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.2
  free_goal_vel: false

  min_obstacle_dist: 0.15
  inflation_dist: 0.35
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.5   # rear legs are 0.6 m back; their sweep reaches ~0.7 m
  # Group occupied cells into small polygons. Without it every cell of the
  # local costmap is a point obstacle: ~2700-3900 with the RTAB-Map grid in
  # it. Offline on lab2 (nothing else running, ~1 min): 10 Hz control-loop
  # overruns 39 -> 8, worst 0.18 -> 0.12 s, move_base CPU 65 -> 52 s.
  costmap_converter_plugin: costmap_converter::CostmapToPolygonsDBSMCCH
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5
  costmap_converter/CostmapToPolygonsDBSMCCH:
    cluster_max_distance: 0.2    # m between cells of one cluster
    cluster_min_pts: 2
    cluster_max_pts: 30          # small clusters: a hull never spans a gap the robot fits through
    convex_hull_min_pt_separation: 0.1

  dt_ref: 0.3
  dt_hysteresis: 0.1
  no_inner_iterations: 5
  no_outer_iterations: 4
  enable_homotopy_class_planning: false   # CPU; one trajectory is enough here

  weight_kinematics_forward_drive: 1000.0  # strongly prefer forward over backward
  weight_kinematics_nh: 50.0              # mostly drive forward along the path (1.0: heading weaved +-80 deg)
  weight_optimaltime: 1.0
  weight_obstacle: 50.0
