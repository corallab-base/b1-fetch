# Shared by the global and local costmaps.
# B1 body ~1.13 x 0.47 m; this is the safety filter's body_box (+4 cm a side).
footprint: [[0.60, 0.28], [0.60, -0.28], [-0.60, -0.28], [-0.60, 0.28]]

obstacles:
  # /obstacles (left/right/front cameras, points 10-90 cm above the floor,
  # 5 cm voxels) marks; /scan (+inf = camera saw only floor) clears, so
  # things that moved away are removed. Heights are in the costmap frame
  # (map/odom), where the floor is at z = 0. Marks only from 15 cm, like
  # RTAB-Map's grid (Grid/MaxGroundHeight): false depth points along cables on
  # the floor made blocking streaks. The safety filter still uses 10 cm.
  observation_sources: cloud scan
  cloud: {data_type: PointCloud2, topic: /obstacles, marking: true, clearing: false,
          min_obstacle_height: 0.15, max_obstacle_height: 1.0, obstacle_range: 3.0}
  scan:  {data_type: LaserScan, topic: /scan, marking: false, clearing: true, inf_is_valid: true,
          min_obstacle_height: 0.0, max_obstacle_height: 1.5, raytrace_range: 3.0}
  combination_method: 1   # max with what's there (keeps the static map's walls)
  track_unknown_space: true

inflation:
  inflation_radius: 0.35     # m; 0.45 closed the gaps between clutter in the lab
  cost_scaling_factor: 4.0
