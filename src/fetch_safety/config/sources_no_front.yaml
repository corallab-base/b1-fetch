# Overrides `sources` in safety_filter.yaml when running without the front
# camera: left/right/rear stay monitored, FORWARD IS UNMONITORED (not blocked).
# Loaded by: roslaunch fetch_safety safety_filter.launch front_camera:=false
sources:
  - name: left_cam
    topic: /cam_left/zone_counts   # counted on the camera's board (zone_checker_node)
    type: counts
    directions: [left]
  - name: right_cam
    topic: /cam_right/zone_counts   # counted on the camera's board (zone_checker_node)
    type: counts
    directions: [right]
  - name: rear_cam
    topic: /cam_rear/zone_counts   # counted on the camera's board (zone_checker_node)
    type: counts
    directions: [backward]
