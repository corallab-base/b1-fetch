# Overrides `sources` in safety_filter.yaml when running without the downward
# front camera: forward is watched by the level front camera only, which can't
# see below ~0.3 m within 1 m of the robot (low obstacles close in front).
# Loaded by: roslaunch fetch_safety safety_filter.launch front_down:=false
sources:
  - name: left_cam
    topic: /cam_left/zone_counts   # counted on the camera's board (zone_checker_node)
    type: counts
    directions: [left]
  - name: right_cam
    topic: /cam_right/zone_counts   # counted on the camera's board (zone_checker_node)
    type: counts
    directions: [right]
  - name: front_cam
    topic: /cam_front/zone_counts   # counted on the camera's board (zone_checker_node)
    type: counts
    directions: [forward]
  - name: rear_cam
    topic: /cam_rear/zone_counts   # counted on the camera's board (zone_checker_node)
    type: counts
    directions: [backward]
